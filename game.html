<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Вова: Охота за яйцами</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: Arial, sans-serif;
            /* Запрещаем системные жесты iOS (зум, обновление страницы свайпом) */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        canvas {
            display: block;
            background-color: black;
            /* Убираем размытие на retina-экранах */
            image-rendering: -webkit-optimize-contrast;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: white;
            font-size: 24px;
            z-index: 100;
        }
        #progressBar {
            width: 80%;
            max-width: 400px;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(to right, #4ca3af, #2c7a85);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }
        #loadingText {
            font-size: 18px;
            margin-top: 10px;
            color: #ccc;
        }
        #scoreDisplay {
            position: absolute;
            /* Отступ сверху с учетом челки iPhone */
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            color: white;
            font-size: 24px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #characterSelect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.9);
        }
        #characterOptions {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .characterOption {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            padding: 15px;
            border-radius: 10px;
        }
        .characterOption:hover {
            transform: scale(1.05);
        }
        .characterOption img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border: 3px solid transparent;
            border-radius: 10px;
            margin-bottom: 15px;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .characterOption p {
            font-size: 20px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
            text-align: center;
        }
        #gameOverScreen, #pauseScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 50;
        }

        #gameOverScreen button, .resumeBtn {
            background: linear-gradient(to bottom, #4ca3af, #2c7a85);
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* --- КНОПКИ УПРАВЛЕНИЯ --- */
        .control-btn {
            /* ПО УМОЛЧАНИЮ СКРЫТЫ НА ПК */
            display: none;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            z-index: 20;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        
        /* Позиционирование с учетом Safe Area для iPhone */
        #leftBtn { 
            left: max(20px, env(safe-area-inset-left)); 
            bottom: max(20px, env(safe-area-inset-bottom)); 
            width: 90px; height: 90px; font-size: 32px;
        }
        #rightBtn { 
            left: max(130px, env(safe-area-inset-left) + 110px); 
            bottom: max(20px, env(safe-area-inset-bottom)); 
            width: 90px; height: 90px; font-size: 32px; 
            right: auto;
        }
        
        #shootBtn {
            right: max(130px, env(safe-area-inset-right) + 110px);
            bottom: max(20px, env(safe-area-inset-bottom));
            width: 90px; height: 90px; font-size: 32px;
            background-color: rgba(255, 100, 100, 0.2);
        }
        
        #powerBtn {
            right: max(20px, env(safe-area-inset-right));
            bottom: max(20px, env(safe-area-inset-bottom));
            width: 90px; height: 90px; font-size: 28px;
            background-color: rgba(100, 200, 255, 0.2);
        }
        
        #pauseBtn {
            right: max(20px, env(safe-area-inset-right));
            top: max(20px, env(safe-area-inset-top));
            width: 60px; height: 60px; font-size: 20px;
        }
        
        /* ПОКАЗЫВАЕМ КНОПКИ ТОЛЬКО НА ТАЧ-УСТРОЙСТВАХ */
        @media (hover: none) and (pointer: coarse) {
            .control-btn {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="scoreDisplay">Очки: 0</div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="loadingScreen">
            <div>Загрузка игры...</div>
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
            <div id="loadingText">0%</div>
        </div>
        
        <div id="characterSelect">
            <h1>Выбери персонажа</h1>
            <div id="characterOptions">
                <div class="characterOption" onclick="selectCharacter(0)">
                    <img id="char1Preview" width="100" alt="Char 1">
                    <p>Нажми 1</p>
                </div>
                <div class="characterOption" onclick="selectCharacter(1)">
                    <img id="char2Preview" width="100" alt="Char 2">
                    <p>Нажми 2</p>
                </div>
            </div>
        </div>
        
        <div id="gameOverScreen">
            <h1>Конец игры!</h1>
            <p id="finalScoreText" style="font-size: 22px; margin-bottom: 20px;"></p>
            <button onclick="document.location='game.html'">Начать заново</button>
            <button onclick="document.location='index.html'">Выйти в меню</button>
        </div>
        
        <div id="pauseScreen">
            <h1>ПАУЗА</h1>
            <p>Нажмите кнопку ниже чтобы продолжить</p>
            <button class="resumeBtn" onclick="resumeGame()">Продолжить</button>
        </div>
        
        <div class="control-btn" id="leftBtn">←</div>
        <div class="control-btn" id="rightBtn">→</div>
        <div class="control-btn" id="shootBtn">⚡</div>
        <div class="control-btn" id="powerBtn">S</div>
        <div class="control-btn" id="pauseBtn">II</div>
    </div>

    <script>
        // Game constants
        const LIVES = 3;
        const FPS = 60;
        const INVINCIBILITY_DURATION = FPS; 
        
        // Game state
        let canvas, ctx;
        let gameWidth, gameHeight;
        let playerPos = { x: 0, y: 0 };
        let lives = LIVES;
        let particles = [];
        let bullets = [];
        let obstacles = [];
        let coins = [];
        let coins2 = [];
        let bonuses = [];
        let lifeAnimations = [];
        let lastLifeAnimationTime = 0;
        let gameOverFlag = false;
        let animationFrameId = null;
        
        // Timers and flags
        let damageTimer = 0, invincibilityTimer = 0, bonusTimer = 0;
        let bossActive = false, bossPos = { x: 0, y: 0 }, bossHealth = 0, bossMaxHealth = 0;
        let bossAttackTimer = 0, bossScatterTimer = 0, warningTimer = 0;
        let difficultyTimer = 0, obstacleSpeedIncrease = 0, shootCooldown = 0;
        let paused = false, poweredUp = false, powerUpTimer = 0, powerUpCooldown = 0;
        let selectedCharacter = 0;
        let isMobile = false, isTablet = false, characterSelectActive = false; 
        
        // Sizes
        let playerSize = 0, obstacleSize = 0, coinSize = 0, coin2Size = 0;
        let lifeSize = 0, bonusSize = 0, bossSize = 0, bulletSize = 0;
        
        // Speeds
        let playerSpeed = 0, baseObstacleSpeed = 0, bossSpeed = 0, bulletSpeed = 0;
        
        // Textures
        const textures = {
            background: null, player: {}, obstacle: null, coin: null,
            coin2: null, heart: null, boss: null, bullet: null,
            bulletPowered: null, icon: null
        };
        
        // Audio
        const audio = {
            coin: null, hit: null, bonus: null, gameover: null, warning: null,
            shoot: null, bossDeath: null, powerup: null, background: null, background5x30: null 
        };
        
        // Control state
        const controls = { left: false, right: false, space: false, shift: false };
        
        // Statistics
        const gameStats = JSON.parse(localStorage.getItem('gameStats')) || {
            totalCoins: 0, totalRareCoins: 0, totalScore: 0, totalDamage: 0,
            totalBosses: 0, totalGames: 0,
            currentGame: { coins: 0, rareCoins: 0, score: 0, damage: 0, bosses: 0 }
        };

        let totalAssets = 0, loadedAssets = 0, assetsLoaded = false;

        function updateProgress() {
            const progress = Math.round((loadedAssets / totalAssets) * 100);
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            if (progressFill) progressFill.style.width = progress + '%';
            if (loadingText) loadingText.textContent = progress + '%';
        }

        function getSelectedMusic() { return localStorage.getItem('selectedMusic') || 'classic'; }

        function getBackgroundAudio() {
            const selectedMusic = getSelectedMusic();
            if (selectedMusic === '5x30' && audio.background5x30) return audio.background5x30;
            return audio.background;
        }

        function playBackgroundMusic() {
            const backgroundAudio = getBackgroundAudio();
            if (backgroundAudio) {
                const savedVolume = localStorage.getItem('musicVolume');
                backgroundAudio.volume = savedVolume ? parseInt(savedVolume) / 100 : 0.5;
                backgroundAudio.loop = true;
                backgroundAudio.play().catch(e => console.log("Bg music err:", e));
            }
        }

        function pauseBackgroundMusic() {
            const backgroundAudio = getBackgroundAudio();
            if (backgroundAudio) backgroundAudio.pause();
        }

        function stopBackgroundMusic() {
            const backgroundAudio = getBackgroundAudio();
            if (backgroundAudio) { backgroundAudio.pause(); backgroundAudio.currentTime = 0; }
        }

        function applySoundVolume() {
            const savedSound = localStorage.getItem('soundVolume');
            const vol = savedSound ? Math.max(0, Math.min(100, parseInt(savedSound))) / 100 : 0.5;
            Object.keys(audio).forEach(key => {
                if (!audio[key] || key === 'background' || key === 'background5x30') return;
                try { audio[key].volume = vol; } catch (e) {}
            });
        }

        function isInvincible() { return invincibilityTimer > 0; }

        function takeDamage() {
            if (isInvincible()) return false;
            playSound(audio.hit);
            damageTimer = FPS / 2;
            lives -= 1;
            addDamage();
            invincibilityTimer = INVINCIBILITY_DURATION;
            if (lives <= 0) { gameOver(); return true; }
            return false; 
        }

        function addScore(points) {
            gameStats.currentGame.score += points;
            gameStats.totalScore += points;
            updateStats(); updateScoreDisplay();
        }

        function addCoins(isRare = false) {
            if(isRare) { gameStats.currentGame.rareCoins++; gameStats.totalRareCoins++; addScore(20); } 
            else { gameStats.currentGame.coins++; gameStats.totalCoins++; addScore(10); }
        }

        function addDamage() { gameStats.currentGame.damage++; gameStats.totalDamage++; updateStats(); }
        function addBoss() { gameStats.currentGame.bosses++; gameStats.totalBosses++; updateStats(); }
        function updateStats() { localStorage.setItem('gameStats', JSON.stringify(gameStats)); }

        function updateScoreDisplay() {
            const scoreElement = document.getElementById('scoreDisplay');
            if(scoreElement) scoreElement.textContent = `Очки: ${gameStats.currentGame.score}`;
        }

        function handleVisibilityChange() { if (document.hidden && !paused && !gameOverFlag && !characterSelectActive) pauseGame(); }
        function handleBlur() { if (!paused && !gameOverFlag && !characterSelectActive) pauseGame(); }
        function handleFocus() {}
        function handlePageHide() { stopGame(); }
        function handleBeforeUnload() { stopGame(); }

        function createObstacle(opts = {}) {
            const x = (typeof opts.x === 'number') ? opts.x : Math.random() * (gameWidth - obstacleSize);
            const y = (typeof opts.y === 'number') ? opts.y : -obstacleSize;
            const dx = (typeof opts.dx === 'number') ? opts.dx : 0;
            const dy = (typeof opts.dy === 'number') ? opts.dy : 0;
            return { x, y, dx, dy };
        }

        function createCoin() { return { x: Math.random() * (gameWidth - coinSize), y: -coinSize }; }
        function createCoin2() { return { x: Math.random() * (gameWidth - coin2Size), y: -coin2Size }; }
        function createBonus() { return { x: Math.random() * (gameWidth - bonusSize), y: -bonusSize }; }

        function detectCollision(obj1, obj2, size1, size2) {
            return (obj1.x < obj2.x + size2 && obj1.x + size1 > obj2.x && obj1.y < obj2.y + size2 && obj1.y + size1 > obj2.y);
        }

        function triggerLifeAnimation(pos) {
            const now = Date.now();
            if (now - lastLifeAnimationTime < 300 || !textures.heart) return;
            lastLifeAnimationTime = now;
            if (lifeAnimations.length > 5) lifeAnimations.shift();
            lifeAnimations.push({ image: textures.heart, x: pos.x, y: pos.y, width: lifeSize * 2, height: lifeSize * 2.4, alpha: 255, timer: 15 });
        }

        function createParticles(x, y, texture) {
            if (!texture) return;
            // Убрано создание временного canvas и getImageData — главных виновников лагов
            const particlesCount = Math.min(10, 100 - particles.length);
            // Используем набор простых цветов для искр
            const colors = ['rgba(255, 215, 0, 0.8)', 'rgba(255, 165, 0, 0.8)', 'rgba(255, 255, 255, 0.8)', 'rgba(76, 163, 175, 0.8)'];
            
            for (let i = 0; i < particlesCount; i++) {
                particles.push({
                    x: x + Math.random() * 20 - 10, 
                    y: y + Math.random() * 20 - 10, 
                    dx: Math.random() * 4 - 2, 
                    dy: Math.random() * 4 - 2,
                    size: Math.random() * 4 + 4, 
                    life: 30,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function spawnBossAttack() { for (let i = 0; i < 10; i++) obstacles.push(createObstacle()); }

        function spawnBossProjectiles(cx, cy, count = 12, speedRange = [gameHeight*0.005, gameHeight*0.02]) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2; 
                const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                obstacles.push(createObstacle({ x: cx, y: cy, dx: vx, dy: vy }));
            }
            playSound(audio.warning);
        }

        function shoot() {
            if (shootCooldown <= 0 && textures.bullet) {
                bullets.push({ x: playerPos.x + playerSize / 2 - bulletSize / 2, y: playerPos.y, powered: poweredUp, width: bulletSize, height: bulletSize });
                playSound(audio.shoot);
                shootCooldown = FPS / 5;
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                if (!bullet) { bullets.splice(i, 1); continue; }
                bullet.y -= bulletSpeed;
                if (bullet.y < -bulletSize) { bullets.splice(i, 1); continue; }
                
                if (bossActive && warningTimer <= 0) {
                    const bossCenterX = bossPos.x + bossSize/2;
                    const bossCenterY = bossPos.y + bossSize/2;
                    const bulletCenterX = bullet.x + bulletSize/2;
                    const bulletCenterY = bullet.y + bulletSize/2;
                    const dx = bossCenterX - bulletCenterX;
                    const dy = bossCenterY - bulletCenterY;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distance < bossSize/2) {
                        bullets.splice(i, 1);
                        bossHealth -= bullet.powered ? 2 : 1;
                        setTimeout(() => { createParticles(bullet.x + bulletSize/2, bullet.y + bulletSize/2, bullet.powered ? textures.bulletPowered : textures.bullet); }, 0);
                        
                        if (bossHealth <= 0) {
                            setTimeout(() => {
                                playSound(audio.bossDeath); addBoss(); addScore(100);
                                createParticles(bossPos.x + bossSize/2, bossPos.y + bossSize/2, textures.boss);
                            }, 0);
                            bossActive = false;
                        }
                    }
                }
            }
        }

        function activatePowerUp() {
            if (powerUpCooldown <= 0 && !poweredUp) {
                poweredUp = true; powerUpTimer = FPS * 10;
                playSound(audio.powerup);
            }
        }

        function gameOver() {
            gameOverFlag = true;
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            stopBackgroundMusic(); playSound(audio.gameover);
            document.getElementById('finalScoreText').textContent = `Очки: ${gameStats.currentGame.score} | Всего очков: ${gameStats.totalScore}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function restartGame() { resetGame(); document.getElementById('gameOverScreen').style.display = 'none'; startGame(); }
        function showCharacterSelect() { characterSelectActive = true; document.getElementById('characterSelect').style.display = 'flex'; }
        
        function selectCharacter(index) {
            characterSelectActive = false; selectedCharacter = index;
            document.getElementById('characterSelect').style.display = 'none';
            resetGame(); startGame();
        }

        function pauseGame() {
            if (characterSelectActive) return;
            paused = true; pauseBackgroundMusic();
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            document.getElementById('pauseScreen').style.display = 'flex';
        }

        function resumeGame() {
            if (gameOverFlag || characterSelectActive) return;
            paused = false; playBackgroundMusic();
            document.getElementById('pauseScreen').style.display = 'none';
            if (!animationFrameId) {
                let lastTime = performance.now();
                function gameLoop(timestamp) {
                    if (!paused && !gameOverFlag) {
                        const deltaTime = timestamp - lastTime;
                        lastTime = timestamp;
                        update(deltaTime); render();
                        animationFrameId = requestAnimationFrame(gameLoop);
                    }
                }
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function stopGame() {
            paused = true; gameOverFlag = true;
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            stopBackgroundMusic();
            Object.values(audio).forEach(sound => {
                if (sound && typeof sound.pause === 'function') { sound.pause(); sound.currentTime = 0; }
            });
        }

        function spawnObjects() {
            if (difficultyTimer > 0 && difficultyTimer % (FPS * 30) === 0) obstacleSpeedIncrease += 0.2;
            
            if (gameStats.currentGame.score > 0 && gameStats.currentGame.score % 100 === 0 && !bossActive) {
                bossActive = true; bossPos = { x: gameWidth / 2 - bossSize / 2, y: -bossSize };
                bossMaxHealth = 10 + Math.floor(gameStats.currentGame.score / 100) * 2;
                bossHealth = bossMaxHealth; warningTimer = FPS * 2;
                playSound(audio.warning); bossScatterTimer = 0; 
            }
            if (obstacles.length < 5 + Math.floor(gameStats.currentGame.score / 50) && Math.random() < 0.05) obstacles.push(createObstacle());
            if (coins.length < 3 && Math.random() < 0.02) coins.push(createCoin());
            if (coins2.length < 2 && Math.random() < 0.01) coins2.push(createCoin2());
            if (bonuses.length < 1 && Math.random() < 0.003) bonuses.push(createBonus());
        }

        function resetGame() {
            gameOverFlag = false;
            playerPos = { x: gameWidth / 2 - playerSize / 2, y: gameHeight - 2 * playerSize };
            lives = LIVES; particles = []; bullets = []; obstacles = []; coins = []; coins2 = []; bonuses = [];
            lifeAnimations = []; lastLifeAnimationTime = 0;
            damageTimer = 0; invincibilityTimer = 0; bonusTimer = 0;
            bossActive = false; bossPos = { x: gameWidth / 2 - bossSize / 2, y: -bossSize };
            bossHealth = 0; bossMaxHealth = 0; bossAttackTimer = 0; warningTimer = 0;
            difficultyTimer = 0; obstacleSpeedIncrease = 0; shootCooldown = 0;
            poweredUp = false; powerUpTimer = 0; powerUpCooldown = 0;
            gameStats.currentGame = { coins: 0, rareCoins: 0, score: 0, damage: 0, bosses: 0 };
            updateScoreDisplay();
        }

        function playSound(sound) {
            if (sound) {
                try {
                    // Музыку на фоне не трогаем
                    if (sound === audio.background || sound === audio.background5x30) {
                        const playPromise = sound.play();
                        if (playPromise !== undefined) playPromise.catch(e => console.log("Bg audio err:", e));
                    } else {
                        // Для коротких эффектов (стрельба) клонируем аудиоузел
                        // Это полностью убирает фризы при частой стрельбе на iOS
                        const soundClone = sound.cloneNode();
                        soundClone.volume = sound.volume;
                        const playPromise = soundClone.play();
                        if (playPromise !== undefined) playPromise.catch(e => {}); 
                    }
                } catch (e) { console.log("Audio error:", e); }
            }
        }

        function handleKeyDown(e) {
            if (document.getElementById('gameOverScreen').style.display === 'flex') {
                if (e.key.toLowerCase() === 'f') { restartGame(); return; } 
                else if (e.key.toLowerCase() === 'l') { if (confirm('Перезапустить?')) window.location.href = 'index.html'; return; }
            }
            if (document.getElementById('characterSelect').style.display === 'flex') {
                if (e.key === '1') selectCharacter(0); else if (e.key === '2') selectCharacter(1); return;
            }
            
            switch(e.code) {
                case 'ArrowLeft': case 'KeyA': controls.left = true; e.preventDefault(); break;
                case 'ArrowRight': case 'KeyD': controls.right = true; e.preventDefault(); break;
                case 'Space': controls.space = true; shoot(); e.preventDefault(); break;
                case 'ShiftLeft': case 'ShiftRight': case 'ControlLeft': case 'ControlRight': case 'KeyS':
                    controls.shift = true; activatePowerUp(); e.preventDefault(); break;
                case 'Escape':
                    if (characterSelectActive) return;
                    if (document.getElementById('pauseScreen').style.display === 'flex') resumeGame(); else pauseGame();
                    e.preventDefault(); break;
            }
        }

        function handleKeyUp(e) {
            switch(e.code) {
                case 'ArrowLeft': case 'KeyA': controls.left = false; e.preventDefault(); break;
                case 'ArrowRight': case 'KeyD': controls.right = false; e.preventDefault(); break;
                case 'Space': controls.space = false; e.preventDefault(); break;
                case 'ShiftLeft': case 'ShiftRight': case 'ControlLeft': case 'ControlRight': case 'KeyS':
                    controls.shift = false; e.preventDefault(); break;
            }
        }

        function setupControls() {
            // Навешиваем слушатели всегда. Кнопки скроются на ПК через CSS Media Queries.
            const bindBtn = (id, startAction, endAction) => {
                const btn = document.getElementById(id);
                if(!btn) return;
                
                const onStart = (e) => { e.preventDefault(); e.stopPropagation(); startAction(); };
                const onEnd = (e) => { e.preventDefault(); e.stopPropagation(); if(endAction) endAction(); };
                
                btn.addEventListener('touchstart', onStart, {passive: false});
                btn.addEventListener('mousedown', onStart, {passive: false});
                btn.addEventListener('touchend', onEnd, {passive: false});
                btn.addEventListener('mouseup', onEnd, {passive: false});
                btn.addEventListener('mouseleave', onEnd, {passive: false});
            };

            bindBtn('leftBtn', () => controls.left = true, () => controls.left = false);
            bindBtn('rightBtn', () => controls.right = true, () => controls.right = false);
            bindBtn('shootBtn', shoot, null);
            bindBtn('powerBtn', activatePowerUp, null);
            bindBtn('pauseBtn', () => {
                if (characterSelectActive) return;
                paused ? resumeGame() : pauseGame();
            }, null);
        }

        function loadAssets() {
            const assets = [
                { name: 'background', path: 'image/background.jpg' },
                { name: 'player0', path: 'image/player.png' }, { name: 'player1', path: 'image/player1.png' },
                { name: 'obstacle', path: 'image/obstacle.png' }, { name: 'coin', path: 'image/coin.png' },
                { name: 'coin2', path: 'image/coin2.png' }, { name: 'heart', path: 'image/heart.png' },
                { name: 'boss', path: 'image/boss.png' }, { name: 'bullet', path: 'image/bullet.png' },
                { name: 'bulletPowered', path: 'image/bullet_blue.png' },
                { name: 'playerRed0', path: 'image/player_red.png' }, { name: 'playerRed1', path: 'image/player1_red.png' },
                { name: 'playerGreen0', path: 'image/player_green.png' }, { name: 'playerGreen1', path: 'image/player1_green.png' },
                { name: 'playerBlue0', path: 'image/player_blue.png' }, { name: 'playerBlue1', path: 'image/player1_blue.png' },
                { name: 'playerBlueRed0', path: 'image/player_blue_red.png' }, { name: 'playerBlueRed1', path: 'image/player1_blue_red.png' },
                { name: 'playerBlueGreen0', path: 'image/player_blue_green.png' }, { name: 'playerBlueGreen1', path: 'image/player1_blue_green.png' },
                { name: 'icon', path: 'image/icon.png' },
                { name: 'coinSound', path: 'music/coin.mp3', audio: true }, { name: 'hitSound', path: 'music/hit.mp3', audio: true },
                { name: 'bonusSound', path: 'music/bonus.mp3', audio: true }, { name: 'gameoverSound', path: 'music/gameover.mp3', audio: true },
                { name: 'warningSound', path: 'music/warning.mp3', audio: true }, { name: 'shootSound', path: 'music/shoot.mp3', audio: true },
                { name: 'bossDeathSound', path: 'music/boss_death.mp3', audio: true }, { name: 'powerupSound', path: 'music/powerup.mp3', audio: true },
                { name: 'backgroundMusic', path: 'music/background.mp3', audio: true }, { name: 'background5x30Music', path: 'music/5x30-background1.mp3', audio: true }
            ];
            
            totalAssets = assets.length; loadedAssets = 0; assetsLoaded = false;
            
            function assetLoaded() {
                loadedAssets++; updateProgress();
                if (loadedAssets === totalAssets && !assetsLoaded) { assetsLoaded = true; completeLoading(); }
            }
            
            function assetError(asset) { console.error(`Error loading asset: ${asset.path}`); assetLoaded(); }
            
            function completeLoading() {
                applySoundVolume();
                document.getElementById('loadingScreen').style.display = 'none';
                setupGame(); showCharacterSelect();
                document.getElementById('char1Preview').src = 'image/player.png';
                document.getElementById('char2Preview').src = 'image/player1.png';
            }
            
            function loadImagesSequentially(index) {
                if (index >= assets.length) { loadAudioAssets(); return; }
                const asset = assets[index];
                if (asset.audio) { loadImagesSequentially(index + 1); return; }
                
                const img = new Image();
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width * 2; tempCanvas.height = img.height * 2;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.imageSmoothingEnabled = true; tempCtx.webkitImageSmoothingEnabled = true; tempCtx.mozImageSmoothingEnabled = true;
                    tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                    if (asset.name.startsWith('player')) textures.player[asset.name] = tempCanvas;
                    else textures[asset.name] = tempCanvas;
                    assetLoaded(); loadImagesSequentially(index + 1);
                };
                img.onerror = () => { assetError(asset); loadImagesSequentially(index + 1); };
                img.src = asset.path;
            }
            
            function loadAudioAssets() {
                const audioAssets = assets.filter(asset => asset.audio);
                let audioLoaded = 0;
                function audioAssetLoaded() {
                    audioLoaded++; assetLoaded(); 
                    if (audioLoaded === audioAssets.length && !assetsLoaded) { assetsLoaded = true; completeLoading(); }
                }
                audioAssets.forEach(asset => {
                    const sound = new Audio(); sound.preload = 'auto';
                    sound.addEventListener('canplaythrough', () => {
                        if (asset.name === 'background5x30Music') audio.background5x30 = sound;
                        else if (asset.name === 'backgroundMusic') audio.background = sound;
                        else {
                            const key = asset.name.replace(/Sound$/, '').replace(/Music$/, '');
                            audio[key] = sound;
                        }
                        audioAssetLoaded();
                    });
                    sound.addEventListener('error', () => { audioAssetLoaded(); });
                    sound.src = asset.path; sound.load();
                });
            }
            loadImagesSequentially(0);
        }

        function setupGame() {
            // ОПТИМИЗАЦИЯ ДЛЯ ВЕРТИКАЛЬНЫХ ТЕЛЕФОНОВ
            const isPortrait = gameHeight > gameWidth;
            // Если устройство держится вертикально (телефон), рассчитываем объекты относительно высоты или увеличенной ширины
            const adaptiveDimension = isPortrait ? gameWidth * 1.5 : gameWidth;
            
            playerSize = adaptiveDimension * 0.04;
            obstacleSize = adaptiveDimension * 0.015;
            coinSize = adaptiveDimension * 0.02;
            coin2Size = adaptiveDimension * 0.02;
            lifeSize = adaptiveDimension * 0.02;
            bonusSize = adaptiveDimension * 0.025;
            bossSize = adaptiveDimension * 0.15;
            bulletSize = adaptiveDimension * 0.01;
            
            playerSpeed = adaptiveDimension * 0.008;
            baseObstacleSpeed = gameHeight * 0.006;
            bossSpeed = gameHeight * 0.003;
            bulletSpeed = gameHeight * 0.01;
            
            setupControls();
        }

        function startGame() {
            gameStats.totalGames++; updateStats();
            playBackgroundMusic();
            let lastTime = 0;
            function gameLoop(timestamp) {
                if (!paused && !gameOverFlag) {
                    const deltaTime = timestamp - lastTime;
                    lastTime = timestamp;
                    update(deltaTime); render();
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update(deltaTime) {
            const deltaFactor = deltaTime / (1000 / FPS);
            difficultyTimer += 1;
            
            if (invincibilityTimer > 0) invincibilityTimer -= deltaFactor;
            if (shootCooldown > 0) shootCooldown -= deltaFactor;
            if (powerUpTimer > 0) {
                powerUpTimer -= deltaFactor;
                if (powerUpTimer <= 0) { poweredUp = false; powerUpCooldown = FPS * 20; }
            }
            if (powerUpCooldown > 0) powerUpCooldown -= deltaFactor;
            
            if (controls.left) { playerPos.x -= playerSpeed * deltaFactor; if (playerPos.x < 0) playerPos.x = 0; }
            if (controls.right) { playerPos.x += playerSpeed * deltaFactor; if (playerPos.x > gameWidth - playerSize) playerPos.x = gameWidth - playerSize; }
            
            spawnObjects();

            if (bossActive) {
                if (warningTimer > 0) {
                    warningTimer -= deltaFactor; if (warningTimer <= 0) bossPos.y = 0;
                } else {
                    if (bossPos.y < gameHeight * 0.2) bossPos.y += bossSpeed * deltaFactor;
                    bossAttackTimer += deltaFactor;
                    if (bossAttackTimer >= FPS * 3) { spawnBossAttack(); bossAttackTimer = 0; }
                    bossScatterTimer += deltaFactor;
                    if (bossScatterTimer >= FPS * 5) {
                        const bossCenterX = bossPos.x + bossSize / 2;
                        const bossCenterY = bossPos.y + (bossSize * 0.75) / 2; 
                        spawnBossProjectiles(bossCenterX, bossCenterY, 12, [gameHeight * 0.006, gameHeight * 0.015]);
                        bossScatterTimer = 0;
                    }
                    bossPos.x += Math.sin(difficultyTimer / 30) * 2 * deltaFactor;
                    bossPos.x = Math.max(0, Math.min(gameWidth - bossSize, bossPos.x));
                }
            }
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                if (!obstacle) { obstacles.splice(i, 1); continue; }
                const extraSpeedY = (baseObstacleSpeed + obstacleSpeedIncrease) * deltaFactor;
                if (typeof obstacle.dx === 'number') obstacle.x += obstacle.dx * deltaFactor;
                if (typeof obstacle.dy === 'number') obstacle.y += obstacle.dy * deltaFactor;
                obstacle.y += extraSpeedY;

                if (obstacle.x < -obstacleSize * 2 || obstacle.x > gameWidth + obstacleSize * 2 || obstacle.y > gameHeight + obstacleSize * 2) {
                    obstacles.splice(i, 1);
                } else if (detectCollision(playerPos, obstacle, playerSize, obstacleSize)) {
                    if (takeDamage()) return; 
                    obstacles.splice(i, 1);
                }
            }
            
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                if (!coin) { coins.splice(i, 1); continue; }
                const extraSpeedY = (baseObstacleSpeed + obstacleSpeedIncrease) * deltaFactor;
                if (typeof coin.dx === 'number') coin.x += coin.dx * deltaFactor;
                if (typeof coin.dy === 'number') coin.y += coin.dy * deltaFactor;
                coin.y += extraSpeedY;
                
                if (coin.x < -coinSize * 2 || coin.x > gameWidth + coinSize * 2 || coin.y > gameHeight + coinSize * 2) {
                    coins.splice(i, 1);
                } else if (detectCollision(playerPos, coin, playerSize, coinSize)) {
                    playSound(audio.coin); createParticles(coin.x, coin.y, textures.coin);
                    coins.splice(i, 1); addCoins();
                }
            }
            
            for (let i = coins2.length - 1; i >= 0; i--) {
                const coin = coins2[i];
                if (!coin) { coins2.splice(i, 1); continue; }
                const extraSpeedY = (baseObstacleSpeed + obstacleSpeedIncrease) * deltaFactor;
                if (typeof coin.dx === 'number') coin.x += coin.dx * deltaFactor;
                if (typeof coin.dy === 'number') coin.y += coin.dy * deltaFactor;
                coin.y += extraSpeedY;
                
                if (coin.x < -coin2Size * 2 || coin.x > gameWidth + coin2Size * 2 || coin.y > gameHeight + coin2Size * 2) {
                    coins2.splice(i, 1);
                } else if (detectCollision(playerPos, coin, playerSize, coin2Size)) {
                    playSound(audio.coin); createParticles(coin.x, coin.y, textures.coin2);
                    coins2.splice(i, 1); addCoins(true);
                }
            }
            
            for (let i = bonuses.length - 1; i >= 0; i--) {
                const bonus = bonuses[i];
                if (!bonus) { bonuses.splice(i, 1); continue; }
                const extraSpeedY = (baseObstacleSpeed + obstacleSpeedIncrease) * deltaFactor;
                if (typeof bonus.dx === 'number') bonus.x += bonus.dx * deltaFactor;
                if (typeof bonus.dy === 'number') bonus.y += bonus.dy * deltaFactor;
                bonus.y += extraSpeedY;
                
                if (bonus.x < -bonusSize * 2 || bonus.x > gameWidth + bonusSize * 2 || bonus.y > gameHeight + bonusSize * 2) {
                    bonuses.splice(i, 1);
                } else if (detectCollision(playerPos, bonus, playerSize, bonusSize)) {
                    playSound(audio.bonus); bonuses.splice(i, 1); bonusTimer = FPS;
                    if (lives < LIVES) {
                        lives += 1;
                        triggerLifeAnimation({ x: playerPos.x + playerSize / 2 - lifeSize, y: playerPos.y - lifeSize * 2 });
                    }
                }
            }
            
            if (bossActive && warningTimer <= 0 && detectCollision(playerPos, bossPos, playerSize, bossSize)) {
                if (takeDamage()) return;
            }
            updateBullets();
        }

        function render() {
            ctx.clearRect(0, 0, gameWidth, gameHeight);
            
            if (textures.background) {
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(textures.background, 0, 0, gameWidth, gameHeight);
            }
            
            if (warningTimer > 0) {
                ctx.fillStyle = 'red'; ctx.font = `${gameHeight * 0.05}px Arial`;
                const text = "ПРИБЛИЖАЕТСЯ БОСС!";
                ctx.fillText(text, gameWidth / 2 - ctx.measureText(text).width / 2, gameHeight / 2);
                if (warningTimer % 20 < 10) { ctx.strokeStyle = 'red'; ctx.lineWidth = 10; ctx.strokeRect(0, 0, gameWidth, gameHeight); }
            }
            
            if (bossActive && warningTimer <= 0 && textures.boss) {
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(textures.boss, bossPos.x, bossPos.y, bossSize, bossSize * 1.5);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(bossPos.x - 5, bossPos.y - 25, bossSize + 10, 20);
                const healthWidth = (bossSize * bossHealth) / bossMaxHealth;
                ctx.fillStyle = bossHealth > bossMaxHealth * 0.5 ? 'lime' : bossHealth > bossMaxHealth * 0.25 ? 'yellow' : 'red';
                ctx.fillRect(bossPos.x, bossPos.y - 20, healthWidth, 10);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(`${bossHealth}/${bossMaxHealth}`, bossPos.x + bossSize/2, bossPos.y - 10);
                ctx.textAlign = 'left';
            }
            
            bullets.forEach(bullet => {
                if (!bullet) return;
                const texture = bullet.powered ? textures.bulletPowered : textures.bullet;
                if (texture) {
                    ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                    ctx.drawImage(texture, bullet.x, bullet.y, bullet.width, bullet.height);
                }
            });
            
            obstacles.forEach(obstacle => {
                if (!obstacle || !textures.obstacle) return;
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(textures.obstacle, obstacle.x, obstacle.y, obstacleSize, obstacleSize * 1.4);
            });
            
            coins.forEach(coin => {
                if (!coin || !textures.coin) return;
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(textures.coin, coin.x, coin.y, coinSize, coinSize * 1.4);
            });
            
            coins2.forEach(coin => {
                if (!coin || !textures.coin2) return;
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(textures.coin2, coin.x, coin.y, coin2Size, coin2Size * 1.4);
            });
            
            bonuses.forEach(bonus => {
                if (!bonus || !textures.heart) return;
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(textures.heart, bonus.x, bonus.y, bonusSize, bonusSize * 1.2);
            });
            
            let playerTexture;
            const playerKey = `player${selectedCharacter}`;
            const playerRedKey = `playerRed${selectedCharacter}`;
            const playerGreenKey = `playerGreen${selectedCharacter}`;
            const playerBlueKey = `playerBlue${selectedCharacter}`;
            const playerBlueRedKey = `playerBlueRed${selectedCharacter}`;
            const playerBlueGreenKey = `playerBlueGreen${selectedCharacter}`;
            const isCurrentlyInvincible = isInvincible();
            
            if (damageTimer > 0) { playerTexture = poweredUp ? (textures.player[playerBlueRedKey] || textures.player[playerKey]) : (textures.player[playerRedKey] || textures.player[playerKey]); damageTimer -= 1; } 
            else if (bonusTimer > 0) { playerTexture = poweredUp ? (textures.player[playerBlueGreenKey] || textures.player[playerKey]) : (textures.player[playerGreenKey] || textures.player[playerKey]); bonusTimer -= 1; } 
            else if (poweredUp) { playerTexture = textures.player[playerBlueKey] || textures.player[playerKey]; } 
            else { playerTexture = textures.player[playerKey]; }
            
            if (playerTexture) {
                ctx.save();
                if (isCurrentlyInvincible && Math.floor(invincibilityTimer / 5) % 2 === 0) ctx.globalAlpha = 0.5;
                ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                ctx.drawImage(playerTexture, playerPos.x, playerPos.y, playerSize, playerSize * 1.5);
                ctx.restore();
            }
            
            if (textures.heart) {
                for (let i = 0; i < lives; i++) {
                    ctx.imageSmoothingEnabled = true; ctx.webkitImageSmoothingEnabled = true; ctx.mozImageSmoothingEnabled = true;
                    ctx.drawImage(textures.heart, 10 + i * (gameWidth * 0.03), gameHeight * 0.07, lifeSize, lifeSize * 1.2);
                }
            }

            ctx.fillStyle = 'white'; ctx.font = `${gameHeight * 0.03}px Arial`;
            const difficultyText = `Уровень сложности: ${1 + Math.floor(obstacleSpeedIncrease / 0.2)}`;
            ctx.fillText(difficultyText, gameWidth - ctx.measureText(difficultyText).width - 10, gameHeight * 0.05);
            
            if (poweredUp) {
                ctx.fillStyle = 'cyan'; const powerText = `Усиление: ${Math.floor(powerUpTimer / FPS) + 1}с`;
                ctx.fillText(powerText, gameWidth / 2 - ctx.measureText(powerText).width / 2, gameHeight * 0.05);
            } else if (powerUpCooldown > 0) {
                ctx.fillStyle = 'gray'; const cooldownText = `Перезарядка: ${Math.floor(powerUpCooldown / FPS) + 1}с`;
                ctx.fillText(cooldownText, gameWidth / 2 - ctx.measureText(cooldownText).width / 2, gameHeight * 0.05);
            }
            
            if (isCurrentlyInvincible) {
                ctx.fillStyle = 'yellow'; const invincibilityText = `Неуязвимость: ${Math.floor(invincibilityTimer / FPS) + 1}с`;
                ctx.fillText(invincibilityText, gameWidth / 2 - ctx.measureText(invincibilityText).width / 2, gameHeight * 0.1);
            }
            
            if (difficultyTimer < FPS * 5) {
                ctx.fillStyle = 'white';
                const controlsText = (isMobile || isTablet) ? "Тап слева/справа: движение | Тап справа: стрельба" : "Стрелки: движение | Пробел: стрельба | SHIFT: усиление | ESC: пауза";
                ctx.fillText(controlsText, gameWidth / 2 - ctx.measureText(controlsText).width / 2, gameHeight - 50);
            }
            
            if (textures.heart) {
                for (let i = lifeAnimations.length - 1; i >= 0; i--) {
                    const anim = lifeAnimations[i];
                    if (!anim) { lifeAnimations.splice(i, 1); continue; }
                    anim.alpha -= 17; anim.timer -= 1;
                    ctx.save(); ctx.globalAlpha = Math.max(anim.alpha, 0) / 255;
                    ctx.drawImage(anim.image, anim.x, anim.y, anim.width, anim.height);
                    ctx.restore();
                    if (anim.timer <= 0 || anim.alpha <= 0) lifeAnimations.splice(i, 1);
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (!p) { particles.splice(i, 1); continue; }
                p.x += p.dx; p.y += p.dy; p.life -= 1;
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function init() {
            canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
            
            isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            isTablet = /iPad|Android|Tablet|Silk/i.test(navigator.userAgent) || (window.innerWidth >= 768 && window.innerHeight >= 1024) || (window.innerWidth >= 1024 && window.innerHeight >= 768);

            // Принудительно показываем кнопки, если определено мобильное устройство
            if (isMobile || isTablet) {
                document.querySelectorAll('.control-btn').forEach(btn => {
                    btn.style.display = 'flex';
                });
            }
            
            const updateCanvasSize = () => {
                gameWidth = window.innerWidth; gameHeight = window.innerHeight;
                canvas.width = gameWidth; canvas.height = gameHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = gameWidth * dpr; canvas.height = gameHeight * dpr;
                ctx.scale(dpr, dpr);
                canvas.style.width = gameWidth + 'px'; canvas.style.height = gameHeight + 'px';
                if (textures.background) setupGame();
            };
            
            updateCanvasSize();
            
            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('blur', handleBlur);
            window.addEventListener('focus', handleFocus);
            window.addEventListener('pagehide', handlePageHide);
            window.addEventListener('beforeunload', handleBeforeUnload);
            document.addEventListener('pause', handleBlur, false); 
            document.addEventListener('resume', handleFocus, false); 
            
            loadAssets();
            
            window.addEventListener('keydown', handleKeyDown); window.addEventListener('keyup', handleKeyUp);
            window.addEventListener('resize', updateCanvasSize);
        }
        window.addEventListener('load', init);
    </script>
